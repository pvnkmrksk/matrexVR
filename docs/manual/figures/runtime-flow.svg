<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-labelledby="title desc">
<title id="title">MATREX VR runtime dataflow</title><desc id="desc">System and experiment JSON flow through MainController and scene controllers. Tracker PUB input reaches ClosedLoop and the virtual rig. ViewportSetter routes its cameras to displays. Frame snapshots feed recordings and separate outbound telemetry.</desc>
