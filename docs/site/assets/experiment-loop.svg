<svg xmlns="http://www.w3.org/2000/svg" width="960" height="236" viewBox="0 0 960 236" fill="none">
<title>Closed-loop experimental workflow</title>
<desc>Animal movement passes through tracking to MATREX VR and the visual stimulus. Visual feedback returns to the animal. Configuration and recordings are retained.</desc>
<rect x=".5" y=".5" width="959" height="235" rx="12" fill="#f6f8fb" stroke="#dce3ec"/>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
<text x="32" y="34" fill="#52657a" font-size="11" letter-spacing="2">CLOSED-LOOP EXPERIMENT</text>
<g fill="white" stroke="#cbd5e1"><rect x="32" y="65" width="190" height="80" rx="6"/><rect x="267" y="65" width="190" height="80" rx="6"/><rect x="502" y="65" width="190" height="80" rx="6"/><rect x="737" y="65" width="190" height="80" rx="6"/></g>
<rect x="502" y="65" width="190" height="80" rx="6" fill="#e8f3f1" stroke="#86b5ae"/>
<g fill="#20334c" font-size="17" font-weight="600"><text x="52" y="98">Animal movement</text><text x="287" y="98">Tracking input</text><text x="522" y="98">MATREX VR</text><text x="757" y="98">Visual stimulus</text></g>
<g fill="#52657a" font-size="12"><text x="52" y="122">Walking · flight</text><text x="287" y="122">Position · orientation</text><text x="522" y="122">Sequence · environment</text><text x="757" y="122">Configured displays</text></g>
<g stroke="#247c75" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M230 105h28m-6-5 6 5-6 5M465 105h28m-6-5 6 5-6 5M700 105h28m-6-5 6 5-6 5"/><path d="M832 155v26H127v-26m-5 6 5-6 5 6"/></g>
<rect x="393" y="170" width="174" height="22" fill="#f6f8fb"/><text x="480" y="185" text-anchor="middle" fill="#247c75" font-size="11" letter-spacing="1">VISUAL FEEDBACK</text>
<text x="480" y="218" text-anchor="middle" fill="#52657a" font-size="11">Configuration snapshots + run recordings → analysis &amp; replay</text>
</g></svg>
